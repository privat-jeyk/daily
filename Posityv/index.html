<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Diary</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="bilder/favicon.jpeg">
</head>

<body>

    <div class="container">

        <header class="page-header">
            <div class="header-content">
                <h1>Mein Tagebuch</h1>
                <p>Halte deine täglichen Gedanken und Stimmungen fest</p>
            </div>

            <button id="hardReloadBtn" class="reload-btn" title="Seite neu laden">
                ↻ Neu laden
            </button>
        </header>


        <div class="card">
            <form id="diaryForm">

                <div class="form-group">
                    <label for="diaryDate">Datum auswählen:</label>
                    <input type="date" id="diaryDate" required>
                </div>

                <div class="form-group">
                    <label>Momentane Stimmung (1 bis 5 Sterne):</label>

                    <div class="rating-bar">
                        <input type="radio" id="star5" name="mood" value="5" required>
                        <label for="star5">★</label>

                        <input type="radio" id="star4" name="mood" value="4">
                        <label for="star4">★</label>

                        <input type="radio" id="star3" name="mood" value="3">
                        <label for="star3">★</label>

                        <input type="radio" id="star2" name="mood" value="2">
                        <label for="star2">★</label>

                        <input type="radio" id="star1" name="mood" value="1">
                        <label for="star1">★</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="diaryComment">
                        Kommentar / Gedanken des Tages:
                    </label>

                    <textarea
                        id="diaryComment"
                        placeholder="Wie war dein Tag? Was hast du erlebt..."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="btn">
                    Eintrag speichern
                </button>

            </form>
        </div>


        <div class="card data-card">

            <h2>💾 Daten verwalten</h2>

            <p class="data-info">
                Sichere deine Tagebucheinträge als JSON-Datei
                oder stelle eine frühere Sicherung wieder her.
            </p>

            <div class="data-buttons">

                <button id="exportJson" class="btn btn-export">
                    📤 JSON exportieren
                </button>

                <button id="importJsonBtn" class="btn btn-import">
                    📥 JSON importieren
                </button>

            </div>

            <input
                type="file"
                id="importJsonInput"
                accept=".json,application/json"
                hidden
            >

        </div>


        <div class="entry-list">

            <h2>Deine Einträge</h2>

            <div id="entriesContainer"></div>

        </div>

    </div>

    <script src="main.js"></script>

</body>
</html>
