<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zentrierte Navigation mit Reload</title>
    <style>
        /* Setzt die Seite auf die volle Höhe und zentriert den Inhalt */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            position: relative; /* Wichtig für die Positionierung des Reload-Buttons */
        }

        /* Reload-Button oben rechts */
        .reload-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .reload-btn:hover {
            background-color: #d0d0d0;
        }

        .reload-btn:active {
            transform: scale(0.98);
        }

        /* Container für die Buttons in der Mitte */
        .nav-container {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Abstand zwischen den Buttons */
            text-align: center;
        }

        /* Styling für die Buttons */
        .nav-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Effekt beim Drüberfahren mit der Maus */
        .nav-btn:hover {
            background-color: #0056b3;
        }

        /* Effekt beim Anklicken */
        .nav-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Neuer Reload-Button oben rechts -->
    <button class="reload-btn" onclick="seiteNeuLaden()">🔄 Neu laden</button>

    <!-- Zentrierte Navigation -->
    <div class="nav-container">
        <h2>Wohin möchtest du gehen?</h2>
        <button class="nav-btn" onclick="navigiereZu('https://privat-jeyk.github.io/daily/CRACY/')">CRACY</button>
        <button class="nav-btn" onclick="navigiereZu('https://privat-jeyk.github.io/daily/MOOD/')">Stimmungstracker</button>
    </div>

    <script>
        // JavaScript-Funktion für die Weiterleitung
        function navigiereZu(zielUrl) {
            window.location.href = zielUrl;
        }

        // JavaScript-Funktion zum Neuladen vom Server
        function seiteNeuLaden() {
            // true erzwingt das Neuladen vom Server (umgeht den Browser-Cache)
            window.location.reload(true);
        }
    </script>

</body>
</html>
