<!-- index.html -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <base href="https://github.io">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Wochenplan</title>

  <meta name="theme-color" content="#0f172a">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<body>

<header>

  <h1>📅 Wochenplan</h1>

  <div class="date-range">
    <input type="date" id="startDate">
    <input type="date" id="endDate">
  </div>

  <div class="top-buttons">
    <button id="addBtn">+ Aufgabe</button>
    <button id="clearBtn">Reset</button>
    <button id="shareBtn">Teilen</button>
  </div>

</header>

<main>

  <section id="planner" class="planner"></section>

  <hr>

  <div id="daySelect" class="day-select"></div>

  <section id="templates" class="templates"></section>

</main>

<script src="js/app.js"></script>

</body>
</html>
