<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Rezeptbuch</title>
    <style>
        :root {
            --dark: #333;
            --light: #f4f4f4;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1, h2 {
            color: var(--dark);
        }
        /* Rezeptliste Styling */
        .rezept-liste {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .rezept-karte {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .rezept-bild {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #ddd;
        }
        .rezept-inhalt {
            padding: 15px;
        }
        .zutaten {
            white-space: pre-line;
            background: #eee;
            padding: 10px;
            border-radius: 4px;
            margin-top: 5px;
        }
        .fehler-meldung {
            background-color: #ffdde0;
            color: #d32f2f;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #d32f2f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📖 Mein Rezeptbuch</h1>
    <p>Diese Rezepte werden dynamisch aus dem Unterordner <code>json/rezepte.json</code> geladen.</p>

    <!-- Liste der Rezepte -->
    <div id="rezept-liste" class="rezept-liste">
        <p>Rezepte werden geladen...</p>
    </div>
</div>

<script>
    const liste = document.getElementById('rezept-liste');
    
    // Platzhalter-Bild, falls im JSON kein Bild-Pfad angegeben ist
    const standardBild = "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='100' height='100' viewBox='0 0 24 24' fill='%23aaa'><path d='M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z'/></svg>";

    // Funktion, um die JSON-Datei aus dem Unterordner auszulesen
    async function ladeRezepte() {
        try {
            // Holt die Daten aus dem Unterordner json
            const antwort = await fetch('json/rezepte.json');
            
            if (!antwort.ok) {
                throw new Error(`Fehler beim Laden der Datei: ${antwort.statusText}`);
            }

            const rezepte = await antwort.json();
            rendereRezepte(rezepte);

        } catch (fehler) {
            console.error(fehler);
            liste.innerHTML = `
                <div class="fehler-meldung">
                    <h3>Fehler beim Laden der Rezepte</h3>
                    <p>Die Datei konnte nicht geladen werden. Bitte überprüfe, ob der Ordner <code>json</code> existiert und die Datei darin exakt <code>rezepte.json</code> heißt.</p>
                </div>
            `;
        }
    }

    // Funktion, um die Rezepte auf der Webseite anzuzeigen
    function rendereRezepte(rezepte) {
        liste.innerHTML = ''; // Platzhalter entfernen

        if (!rezepte || rezepte.length === 0) {
            liste.innerHTML = '<p>Die JSON-Datei enthält keine Rezepte.</p>';
            return;
        }

        rezepte.forEach(rezept => {
            const karte = document.createElement('div');
            karte.className = 'rezept-karte';
            
            // Nutze das angegebene Bild oder das Standardbild
            const bildQuelle = rezept.bild || standardBild;

            karte.innerHTML = `
                <img class="rezept-bild" src="${bildQuelle}" alt="${rezept.titel}">
                <div class="rezept-inhalt">
                    <h3>${rezept.titel}</h3>
                    <h4>Zutaten:</h4>
                    <p class="zutaten">${rezept.zutaten}</p>
                </div>
            `;
            liste.appendChild(karte);
        });
    }

    // Starte den Ladevorgang beim Seitenaufruf
    ladeRezepte();
</script>

</body>
</html>
