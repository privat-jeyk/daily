<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyrim Rezepte</title>
</head>
<body>

<div class="container">
    <h1>📖 Skyrim Rezepte</h1>

    <!-- Formular zum Hinzufügen -->
    <form id="rezept-form">
        <h2>Neues Rezept hinzufügen</h2>
        
        <label for="bild">Rezept-Bild auswählen:</label>
        <input type="file" id="bild" accept="image/*">

        <label for="titel">Name des Gerichts:</label>
        <input type="text" id="titel" required placeholder="Z.B. Spaghetti Carbonara">

        <label for="zutaten">Zutaten (eine pro Zeile):</label>
        <textarea id="zutaten" rows="6" required placeholder="Z.B.&#10;200g Spaghetti&#10;100g Speck&#10;2 Eier"></textarea>

        <button type="submit">Rezept speichern</button>
    </form>

    <!-- Backup Optionen -->
    <div style="margin-bottom: 20px;">
        <button onclick="exportiereJSON()" class="secondary-btn">Als JSON exportieren (Backup)</button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importiereJSON(this)">
        <button onclick="document.getElementById('import-file').click()" class="secondary-btn">JSON importieren</button>
    </div>

    <!-- Liste der Rezepte -->
    <h2>Gespeicherte Rezepte</h2>
    <div id="rezept-liste" class="rezept-liste"></div>
</div>

</body>
</html>
