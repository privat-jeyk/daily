<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Rezeptbuch</title>
    <style>
        :root {
            --primary: #4CAF50;
            --dark: #333;
            --light: #f4f4f4;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1, h2 {
            color: var(--dark);
        }
        /* Formular Styling */
        form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: var(--primary);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            opacity: 0.9;
        }
        .secondary-btn {
            background-color: #555;
            margin-top: 10px;
        }
        /* Rezeptliste Styling */
        .rezept-liste {
            display: grid;
            gap: 20px;
        }
        .rezept-karte {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }
        .loesch-btn {
            background-color: #f44336;
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 5px 10px;
            font-size: 12px;
        }
        .zutaten {
            white-space: pre-line;
            background: #eee;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📖 Mein Rezeptbuch</h1>

    <!-- Formular zum Hinzufügen -->
    <form id="rezept-form">
        <h2>Neues Rezept hinzufügen</h2>
        <label for="titel">Name des Gerichts:</label>
        <input type="text" id="titel" required placeholder="Z.B. Spaghetti Carbonara">

        <label for="zutaten">Zutaten (eine pro Zeile):</label>
        <textarea id="zutaten" rows="4" required placeholder="Z.B.&#10;200g Spaghetti&#10;100g Speck"></textarea>

        <label for="anleitung">Zubereitung:</label>
        <textarea id="anleitung" rows="4" required placeholder="Schritt für Schritt Anleitung..."></textarea>

        <button type="submit">Rezept speichern</button>
    </form>

    <!-- Backup Optionen -->
    <div style="margin-bottom: 20px;">
        <button onclick="exportiereJSON()" class="secondary-btn">Als JSON exportieren (Backup)</button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importiereJSON(this)">
        <button onclick="document.getElementById('import-file').click()" class="secondary-btn">JSON importieren</button>
    </div>

    <!-- Liste der Rezepte -->
    <h2>Gespeicherte Rezepte</h2>
    <div id="rezept-liste" class="rezept-liste"></div>
</div>

<script>
    // 1. Daten beim Start laden (entweder aus dem LocalStorage oder leeres Array)
    let rezepte = JSON.parse(localStorage.getItem('rezepte')) || [];

    const form = document.getElementById('rezept-form');
    const liste = document.getElementById('rezept-liste');

    // 2. Event-Listener für das Formular
    form.addEventListener('submit', (e) => {
        e.preventDefault(); // Verhindert das Neuladen der Seite

        // Werte auslesen
        const neuesRezept = {
            id: Date.now(), // Eindeutige ID erzeugen
            titel: document.getElementById('titel').value,
            zutaten: document.getElementById('zutaten').value,
            anleitung: document.getElementById('anleitung').value
        };

        // Rezept zum Array hinzufügen
        rezepte.push(neuesRezept);
        
        // Speichern und Oberfläche aktualisieren
        speichereDaten();
        rendereRezepte();

        // Formular zurücksetzen
        form.reset();
    });

    // 3. Rezepte im Browser-Speicher sichern
    function speichereDaten() {
        localStorage.setItem('rezepte', JSON.stringify(rezepte));
    }

    // 4. Rezepte auf der Webseite anzeigen
    function rendereRezepte() {
        liste.innerHTML = ''; // Liste leeren

        if (rezepte.length === 0) {
            liste.innerHTML = '<p>Noch keine Rezepte eingetragen.</p>';
            return;
        }

        rezepte.forEach(rezept => {
            const karte = document.createElement('div');
            karte.className = 'rezept-karte';
            
            karte.innerHTML = `
                <h3>${rezept.titel}</h3>
                <button class="loesch-btn" onclick="loescheRezept(${rezept.id})">Löschen</button>
                <h4>Zutaten:</h4>
                <p class="zutaten">${rezept.zutaten}</p>
                <h4>Zubereitung:</h4>
                <p>${rezept.anleitung.replace(/\n/g, '<br>')}</p>
            `;
            liste.appendChild(karte);
        });
    }

    // 5. Rezept löschen
    function loescheRezept(id) {
        rezepte = rezepte.filter(r => r.id !== id);
        speichereDaten();
        rendereRezepte();
    }

    // 6. JSON-Datei herunterladen (Export)
    function exportiereJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(rezepte, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "rezepte_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    // 7. JSON-Datei einlesen (Import)
    function importiereJSON(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importierteRezepte = JSON.parse(e.target.result);
                if (Array.isArray(importierteRezepte)) {
                    rezepte = importierteRezepte;
                    speichereDaten();
                    rendereRezepte();
                    alert('Rezepte erfolgreich importiert!');
                } else {
                    alert('Ungültiges Dateiformat.');
                }
            } catch (error) {
                alert('Fehler beim Lesen der JSON-Datei.');
            }
        };
        reader.readAsText(file);
    }

    // Erste Anzeige beim Laden der Seite
    rendereRezepte();
</script>

</body>
</html>
