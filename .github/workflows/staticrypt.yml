name: Webseite verschlüsseln und hochladen

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Passwortschutz absolut sicher einbauen
        run: |
          PASSWORD="${{ secrets.STATICRYPT_PASSWORD }}"
          PASSWORD_HASH=$(echo -n "$PASSWORD" | sha256sum | cut -d' ' -f1)

          # Erstellt ein separates Skript, das die Sperre über die Seite legt
          cat << EOF > bouncer.js
          (function() {
            // Versteckt sofort den gesamten Inhalt der Seite, damit niemand spicken kann
            const style = document.createElement('style');
            style.innerHTML = 'html { display: none !important; }';
            document.head.appendChild(style);

            document.addEventListener("DOMContentLoaded", function() {
              // Erstellt die dunkle Passwort-Eingabemaske
              const overlay = document.createElement('div');
              overlay.id = 'crypto-lock-overlay';
              overlay.style = 'position:fixed; top:0; left:0; width:100vw; height:100vh; background:#1e1e24; color:#fff; font-family:sans-serif; display:flex; justify-content:center; align-items:center; z-index:9999999;';
              overlay.innerHTML = '<div style="background:#2a2a35; padding:30px; border-radius:8px; box-shadow:0 4px 15px rgba(0,0,0,0.3); text-align:center;"><h3>Gesperrtes Repository</h3><input type="password" id="crypto-pw-input" placeholder="Passwort eingeben" style="padding:10px; border:none; border-radius:4px; margin-top:10px; width:80%;"><br><button id="crypto-unlock-btn" style="padding:10px 20px; border:none; background:#007acc; color:white; border-radius:4px; cursor:pointer; margin-top:10px;">Entsperren</button></div>';
              
              // Blendet die Seite für die Passworteingabe wieder ein, aber überdeckt sie mit der Maske
              style.remove();
              document.body.appendChild(overlay);

              async function checkCryptoLock() {
                const input = document.getElementById('crypto-pw-input').value;
                const encoder = new TextEncoder();
                const data = encoder.encode(input);
                const buffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(buffer));
                const inputHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                
                if (inputHash === "${PASSWORD_HASH}") {
                  overlay.remove();
                } else {
                  alert('Falsches Passwort!');
                }
              }

              document.getElementById('crypto-unlock-btn').addEventListener('click', checkCryptoLock);
              document.getElementById('crypto-pw-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') checkCryptoLock();
              });
            });
          })();
          EOF

          # Fügt das Schutz-Skript als allererste Zeile in deine index.html ein
          echo "<script>$(cat bouncer.js)</script>$(cat index.html)" > index.html
          rm bouncer.js

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Dateien verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Direkt zu GitHub Pages hochladen
        uses: actions/deploy-pages@v4
