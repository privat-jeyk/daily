name: Webseite verschlüsseln und hochladen

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Datei mit StatiCrypt verschlüsseln
        run: |
          # Installiert das originale StatiCrypt-Paket
          npm install -g staticrypt
          
          # Erstellt eine perfekt verschlüsselte 'encrypted.html' im Hintergrund
          staticrypt index.html "${{ secrets.STATICRYPT_PASSWORD }}" -t "Geschützter Bereich" -i "Bitte gib dein Passwort ein." --short
          
          # Ersetzt deine unverschlüsselte index.html mit der passwortgeschützten Version
          mv encrypted.html index.html

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Dateien verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Direkt zu GitHub Pages hochladen
        uses: actions/deploy-pages@v4
