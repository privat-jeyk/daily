name: Webseite verschlüsseln und hochladen

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Webseite mit Passwort sperren
        run: |
          # Führt den Schutz fehlerfrei ohne Terminal-Abfragen aus
          npx pagecrypt index.html index.html "${{ secrets.STATICRYPT_PASSWORD }}"

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Dateien verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Direkt zu GitHub Pages hochladen
        uses: actions/deploy-pages@v4
