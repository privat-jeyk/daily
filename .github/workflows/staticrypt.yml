name: Verschlüssele und veröffentliche Seite

on:
  push:
    branches:
      - main  # Falls dein Haupt-Branch 'master' heißt, hier master eintragen

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: StatiCrypt installieren und ausführen
        run: |
          npm install -g staticrypt
          staticrypt index.html "${{ secrets.STATICRYPT_PASSWORD }}" -o index.html

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Dateien für den Upload verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Verpackt die frisch verschlüsselte index.html

      - name: Direkt zu GitHub Pages hochladen
        uses: actions/deploy-pages@v4
