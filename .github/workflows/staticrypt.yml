name: Webseite verschlüsseln und hochladen

on:
  push:
    branches:
      - main

# Temporärer Fix, falls doch noch eine ältere Action Node 20 verlangt
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Auf v4.2.2+ aktualisiert für Node 24 Support
      - name: Code auschecken
        uses: actions/checkout@v4.2.2

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Das ist deine Projekt-Node-Version, das ist okay!

      - name: Webseite mit Passwort sperren
        run: |
          npx pagecrypt index.html index.html "${{ secrets.STATICRYPT_PASSWORD }}"

      # Auf v6 aktualisiert
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v6

      # Auf v5 aktualisiert
      - name: Dateien verpacken
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      # Auf v5 aktualisiert
      - name: Direkt zu GitHub Pages hochladen
        uses: actions/deploy-pages@v5

      - name: Sende Telegram Benachrichtigung
        uses: appleboy/telegram-action@master
        if: always()
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Repository: ${{ github.repository }}
            Commit: ${{ github.event.head_commit.message }}
            Status: ${{ job.status == 'success' && '✅ ERFOLGREICH' || '❌ FEHLGESCHLAGEN' }}
            Link: https://github.com{{ github.repository }}/actions/runs/${{ github.run_id }}
