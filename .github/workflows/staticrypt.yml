name: Webseite verschlüsseln und hochladen

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Mit StatiCrypt verschlüsseln
        run: |
          # Führt StatiCrypt direkt aus, erstellt 'encrypted/index.html'
          # und unterdrückt alle interaktiven Fragen
          npx staticrypt index.html "${{ secrets.STATICRYPT_PASSWORD }}" -t "Geschützter Bereich" -i "Bitte gib dein Passwort ein."

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Dateien verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          # Wir übergeben exakt den Ordner, den StatiCrypt standardmäßig erstellt
          path: './encrypted'

      - name: Direkt zu GitHub Pages hochladen
        uses: actions/deploy-pages@v4
