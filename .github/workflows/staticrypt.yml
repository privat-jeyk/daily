name: Webseite verschlüsseln und hochladen

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Altes Verzeichnis bereinigen
        run: rm -rf encrypted

      - name: Mit StatiCrypt verschlüsseln
        run: |
          npx staticrypt index.html "${{ secrets.STATICRYPT_PASSWORD }}" \
            -t "Geschützter Bereich" \
            -i "Bitte gib dein Passwort ein." \
            --non-interactive

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Dateien verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: './encrypted'

      - name: Direkt zu GitHub Pages hochladen
        uses: actions/deploy-pages@v4
