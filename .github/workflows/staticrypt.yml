name: Webseite verschlüsseln und hochladen

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Datei mit StatiCrypt verschlüsseln
        run: |
          # Installiert StatiCrypt im Runner
          npm install staticrypt
          
          # Führt StatiCrypt ohne interaktive Abfragen aus
          npx staticrypt index.html --passphrase "${{ secrets.STATICRYPT_PASSWORD }}" -t "Geschützter Bereich" -i "Bitte gib dein Passwort ein."

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Dateien verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          # Lädt den von StatiCrypt erstellten Ordner hoch
          path: './encrypted'

      - name: Direkt zu GitHub Pages hochladen
        uses: actions/deploy-pages@v4
